<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約する — オーナーズポータル</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="../index.html" class="site-logo">
        🏠 オーナーズポータル
        <span>宿泊予約管理</span>
      </a>
      <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="../index.html">ホーム</a>
        <a href="properties.html">物件一覧</a>
        <a href="booking.html" aria-current="page">予約する</a>
        <a href="reservations.html">予約一覧</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <header class="page-header">
        <h1>新規予約</h1>
        <p>宿泊予約を新規作成します。必要事項を入力してください。</p>
      </header>

      <!-- 完了メッセージ（送信後に表示） -->
      <div id="success-message" class="alert alert-success hidden" role="alert">
        ✅ 予約を受け付けました。予約一覧ページで確認できます。
      </div>

      <!-- 予約フォーム -->
      <section aria-label="予約フォーム">
        <form id="booking-form" class="form-section" novalidate>

          <fieldset style="border:none;padding:0;margin-bottom:var(--spacing-8);">
            <legend style="font-size:var(--font-size-lg);font-weight:700;margin-bottom:var(--spacing-6);padding-bottom:var(--spacing-4);border-bottom:1px solid var(--color-border);width:100%)">
              📍 物件・日程
            </legend>

            <div class="form-group">
              <label class="form-label" for="property">
                物件<span class="required" aria-label="必須">*</span>
              </label>
              <select id="property" name="property" class="form-control" required>
                <option value="">物件を選択してください</option>
                <option value="1">新宿の一軒家（東京都新宿区）</option>
                <option value="2">京都の町家（京都府京都市中京区）</option>
                <option value="3">沖縄のマンション（沖縄県那覇市）</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="checkin">
                  チェックイン日<span class="required" aria-label="必須">*</span>
                </label>
                <input
                  type="date"
                  id="checkin"
                  name="checkin"
                  class="form-control"
                  required
                  min=""
                >
              </div>
              <div class="form-group">
                <label class="form-label" for="checkout">
                  チェックアウト日<span class="required" aria-label="必須">*</span>
                </label>
                <input
                  type="date"
                  id="checkout"
                  name="checkout"
                  class="form-control"
                  required
                  min=""
                >
              </div>
            </div>

            <div id="nights-display" class="nights-display" aria-live="polite"></div>

            <div class="form-group mt-4">
              <label class="form-label" for="guests">
                宿泊人数<span class="required" aria-label="必須">*</span>
              </label>
              <select id="guests" name="guests" class="form-control" required>
                <option value="">人数を選択</option>
                <option value="1">1 名</option>
                <option value="2">2 名</option>
                <option value="3">3 名</option>
                <option value="4">4 名</option>
                <option value="5">5 名</option>
                <option value="6">6 名</option>
              </select>
            </div>
          </fieldset>

          <fieldset style="border:none;padding:0;margin-bottom:var(--spacing-8);">
            <legend style="font-size:var(--font-size-lg);font-weight:700;margin-bottom:var(--spacing-6);padding-bottom:var(--spacing-4);border-bottom:1px solid var(--color-border);width:100%">
              👤 宿泊者情報
            </legend>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="guest-name">
                  氏名<span class="required" aria-label="必須">*</span>
                </label>
                <input
                  type="text"
                  id="guest-name"
                  name="guest_name"
                  class="form-control"
                  placeholder="例：山田 太郎"
                  required
                  autocomplete="name"
                >
              </div>
              <div class="form-group">
                <label class="form-label" for="guest-name-kana">氏名（フリガナ）</label>
                <input
                  type="text"
                  id="guest-name-kana"
                  name="guest_name_kana"
                  class="form-control"
                  placeholder="例：ヤマダ タロウ"
                  autocomplete="off"
                >
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="guest-email">
                  メールアドレス<span class="required" aria-label="必須">*</span>
                </label>
                <input
                  type="email"
                  id="guest-email"
                  name="guest_email"
                  class="form-control"
                  placeholder="例：taro@example.com"
                  required
                  autocomplete="email"
                >
              </div>
              <div class="form-group">
                <label class="form-label" for="guest-tel">電話番号</label>
                <input
                  type="tel"
                  id="guest-tel"
                  name="guest_tel"
                  class="form-control"
                  placeholder="例：090-1234-5678"
                  autocomplete="tel"
                >
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="notes">備考・特記事項</label>
              <textarea
                id="notes"
                name="notes"
                class="form-control"
                rows="4"
                placeholder="アレルギー、ご要望、チェックイン予定時刻などをご記入ください。"
              ></textarea>
              <span class="form-hint">任意項目です。特記事項がある場合のみご記入ください。</span>
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg">予約を確定する</button>
            <a href="reservations.html" class="btn btn-ghost">キャンセル</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <span>🏠 オーナーズポータル</span>
      <small>© 2026 Owner's Portal. All rights reserved.</small>
    </div>
  </footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
