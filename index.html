<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>森に浮かぶ集落 — オーナー宿泊予約</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="login-page">
    <!-- 左：森のビジュアル -->
    <div class="login-visual" role="img" aria-label="森に浮かぶ集落の外観">
      <div class="login-visual-caption">
        <h1>森に浮かぶ<br>集落</h1>
        <p>Owner Accommodation Reservation</p>
      </div>
    </div>

    <!-- 右：ログインパネル -->
    <div class="login-panel">
      <div class="login-panel-heading">
        <h2>ログイン</h2>
        <p>Owner Portal</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="username">オーナーID</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            placeholder="ID を入力"
            required
          >
        </div>
        <div class="form-field">
          <label for="password">パスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="パスワードを入力"
            required
          >
        </div>

        <div class="form-error" id="login-error" aria-live="polite"></div>

        <div style="margin-top:2.5rem;">
          <button type="submit" class="btn btn-forest btn-full">ログイン</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
